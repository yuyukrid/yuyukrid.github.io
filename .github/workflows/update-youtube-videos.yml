name: 最新YouTube動画とブログ記事を更新

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'

permissions:
  contents: write

concurrency:
  group: update-public-content
  cancel-in-progress: false

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを設定
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 最新動画・ブログ記事データを生成
        run: |
          node tools/update-youtube-videos.mjs
          node tools/update-blog-articles.mjs

      - name: 変更をコミット
        run: |
          if git diff --quiet -- data/latest-videos.json data/latest-blog-articles.json; then
            echo "動画・ブログ記事データに変更はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-videos.json data/latest-blog-articles.json
          git commit -m "chore: 最新動画とブログ記事を更新"
          git push
