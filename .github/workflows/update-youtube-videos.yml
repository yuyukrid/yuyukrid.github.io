name: 最新YouTube動画を更新

on:
  workflow_dispatch:
  schedule:
    - cron: '20 0 * * *'

permissions:
  contents: write

concurrency:
  group: update-youtube-videos
  cancel-in-progress: false

jobs:
  update-videos:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node.jsを設定
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 最新動画データを生成
        run: node tools/update-youtube-videos.mjs

      - name: 変更をコミット
        run: |
          if git diff --quiet -- data/latest-videos.json; then
            echo "動画データに変更はありません。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest-videos.json
          git commit -m "chore: 最新YouTube動画を更新"
          git push
